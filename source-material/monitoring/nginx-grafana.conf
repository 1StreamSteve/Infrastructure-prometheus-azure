# /etc/nginx/sites-available/prometheus.1stream.co.za.conf
# Reverse proxy for Grafana on the dedicated monitoring VM.
# Traffic arrives from the LBs (VM1/VM2) which handle geo-blocking, bot
# filtering, rate limiting, and SSL termination. Basic auth is NOT used
# here — Grafana's own login is the authentication layer.

# ── Rate limiting zones ──────────────────────────────────────────────────────
# Limit login attempts to prevent brute-force on basic auth + Grafana login
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# General request rate limit
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# HTTP → HTTPS redirect
server {
    listen      80;
    listen      [::]:80;
    server_name prometheus.1stream.co.za;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Grafana reverse proxy (hardened)
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name prometheus.1stream.co.za;

    # ── TLS ──────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/star.1stream.co.za.crt;
    ssl_certificate_key /etc/nginx/ssl/star.1stream.co.za.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling (if your cert supports it)
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── Security headers ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header X-Robots-Tag              "noindex, nofollow, noarchive"                 always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"    always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://prometheus.1stream.co.za;" always;

    # ── Hide server tokens ───────────────────────────────────────────────
    server_tokens off;

    # ── Request size limits ──────────────────────────────────────────────
    client_max_body_size 2m;
    client_body_timeout  10s;
    client_header_timeout 10s;

    # ── Rate limiting ────────────────────────────────────────────────────
    limit_req zone=general burst=50 nodelay;

    # ── Proxy to Grafana ─────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support for Grafana Live
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Don't pass proxy errors to client in detail
        proxy_intercept_errors off;
    }

    # ── Grafana login — stricter rate limit ──────────────────────────────
    location /login {
        limit_req zone=login burst=3 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Grafana API login — same strict rate limit ───────────────────────
    location /api/login {
        limit_req zone=login burst=3 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Health endpoint (for uptime monitors) ───────────────────────────
    location = /api/health {
        limit_req zone=general burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # ── Block common attack paths ────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(git|env|bak|old|orig|swp|sql)$ {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/prometheus.1stream.co.za.access.log;
    error_log  /var/log/nginx/prometheus.1stream.co.za.error.log;
}
