# ── prometheus.1stream.co.za — LB vhost for Grafana ─────────────────────────
# Deploy to VM1 and VM2: /etc/nginx/sites-available/prometheus.1stream.co.za.conf
# Proxies to the monitoring VM's nginx (HTTPS on 10.0.0.6:443)

# ── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=grafana_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=grafana_general:10m rate=30r/s;

# ── WebSocket upgrade map (for Grafana Live) ─────────────────────────────────
# NOTE: If you already have this map in nginx.conf or another vhost, remove this
# block to avoid a duplicate directive error.
map $http_upgrade $grafana_connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name prometheus.1stream.co.za;

    access_log /var/log/nginx/prometheus-access.log main;
    error_log  /var/log/nginx/prometheus-error.log warn;

    location = /health {
        access_log off;
        add_header Content-Type "application/json" always;
        root /var/www/html;
        try_files /health.json =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prometheus.1stream.co.za;

    access_log /var/log/nginx/prometheus-access.log main;
    error_log  /var/log/nginx/prometheus-error.log warn;

    # ── SSL ───────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/star.1stream.co.za.crt;
    ssl_certificate_key /etc/nginx/ssl/star.1stream.co.za.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling — requires full chain (domain cert + intermediates) in ssl_certificate
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout    5s;

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains; preload"    always;
    add_header X-Frame-Options             "DENY"                                            always;
    add_header X-Content-Type-Options      "nosniff"                                         always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"                  always;
    add_header X-Robots-Tag                "noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai" always;
    add_header Permissions-Policy          "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), sync-xhr=*, fullscreen=(self), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy  "same-origin"                                     always;
    add_header Cross-Origin-Resource-Policy "same-site"                                      always;
    add_header Content-Security-Policy     "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self' wss:; frame-ancestors 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; font-src 'self' data:;" always;

    server_tokens off;

    # ── Request limits ────────────────────────────────────────────────────
    client_max_body_size  2m;
    client_body_timeout   10s;
    client_header_timeout 10s;

    # ── Access control ────────────────────────────────────────────────────
    # Geo restriction — South Africa only
    # $geo_sa_ip_allowed is set by the geo block in nginx.conf
    if ($geo_sa_ip_allowed = "no") {
        return 403;
    }

    # AI scraper and bad bot blocking
    # $block_bad_bot is set by the map block in nginx.conf
    if ($block_bad_bot) {
        return 403;
    }

    # ── Health / status endpoints ─────────────────────────────────────────
    location = /health {
        access_log off;
        add_header Content-Type "application/json" always;
        root /var/www/html;
        try_files /health.json =404;
    }

    location = /robots.txt {
        access_log off;
        root /var/www/html;
        try_files /robots.txt =404;
    }

    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
    }

    # ── Grafana login — strict rate limit ─────────────────────────────────
    location = /login {
        limit_req zone=grafana_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass             https://10.0.0.6;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        $grafana_connection_upgrade;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;
        proxy_buffering        on;
        proxy_buffer_size      16k;
        proxy_buffers          8 16k;
        proxy_intercept_errors off;
    }

    # ── Grafana API login — same strict rate limit ────────────────────────
    location /api/login {
        limit_req zone=grafana_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass             https://10.0.0.6;
        proxy_http_version     1.1;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }

    # ── All other Grafana traffic ─────────────────────────────────────────
    location / {
        limit_req zone=grafana_general burst=50 nodelay;

        proxy_pass                https://10.0.0.6;
        proxy_http_version        1.1;
        proxy_set_header          Host              $host;
        proxy_set_header          X-Real-IP         $remote_addr;
        proxy_set_header          X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header          X-Forwarded-Proto $scheme;
        proxy_set_header          Upgrade           $http_upgrade;
        proxy_set_header          Connection        $grafana_connection_upgrade;
        proxy_connect_timeout     10s;
        proxy_send_timeout        600s;
        proxy_read_timeout        600s;
        proxy_buffering           on;
        proxy_buffer_size         16k;
        proxy_buffers             8 16k;
        proxy_next_upstream       error timeout;
        proxy_next_upstream_tries 2;
    }

    # ── Block common attack paths ─────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(git|env|bak|old|orig|swp|sql)$ {
        deny all;
        return 404;
    }

    # ── Error pages ───────────────────────────────────────────────────────
    error_page 403 /403.html;
    location = /403.html {
        root /var/www/html;
        internal;
    }

    error_page 429 /429.html;
    location = /429.html {
        root /var/www/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/html;
        internal;
    }
}
