# /etc/prometheus/prometheus.yml
# Monitoring-VM-001: Prometheus scrape config. Managed in git
# (Infrastructure-prometheus-azure). Do not edit on the server: sync.sh
# overwrites it.
#
# Targets live in files, not here:
#   targets/infrastructure.yml   monitoring VM and the nginx pair      (git)
#   targets/external.yml         external HTTP probes                  (git)
#   targets/customers/*.yml      one file per customer                 (server only)
#
# Adding or removing a customer is a file in targets/customers/. Prometheus
# picks a new, changed or deleted file up by itself, with no reload. Check the
# file first:
#   python3 /opt/prometheus-azure-build/tools/check-targets.py
# The template is targets/customer.yml.example.
#
# Every target sets its own `job` label (e.g. node-citiq-v2-odoo). Prometheus
# only uses job_name when a target has no job label, so the job names below are
# just scrape pools. Each pool keeps the targets whose job matches its prefix.

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    project:     '1scx'

rule_files: []

scrape_configs:

  # node_exporter: monitoring VM, nginx pair, customer Odoo and Postgres VMs
  - job_name: 'node'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/infrastructure.yml
          - /etc/prometheus/targets/customers/*.yml
    relabel_configs:
      - source_labels: [job]
        regex: 'node-.+'
        action: keep

  # nginx exporter on the nginx pair
  - job_name: 'nginx'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/infrastructure.yml
    relabel_configs:
      - source_labels: [job]
        regex: 'nginx-.+'
        action: keep

  # postgres_exporter on customer Postgres VMs
  - job_name: 'postgres'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/customers/*.yml
    relabel_configs:
      - source_labels: [job]
        regex: 'postgres-.+'
        action: keep

  # Customer Odoo, probed on the internal IP:8069 through blackbox_exporter.
  # http_2xx_lenient: Odoo answers HTTP/1.0, which http_2xx rejects.
  - job_name: 'blackbox-customer'
    scrape_interval: 30s
    scrape_timeout:  15s
    metrics_path: /probe
    params:
      module: [http_2xx_lenient]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/customers/*.yml
    relabel_configs:
      - source_labels: [job]
        regex: 'blackbox-.+'
        action: keep
      - source_labels: [job]
        regex: 'blackbox-ext-.+'
        action: drop
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # External HTTPS sites, probed from Azure through blackbox_exporter
  - job_name: 'blackbox-external'
    scrape_interval: 60s
    scrape_timeout:  15s
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/external.yml
    relabel_configs:
      - source_labels: [job]
        regex: 'blackbox-ext-.+'
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
