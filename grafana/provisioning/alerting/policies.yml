# /etc/grafana/provisioning/alerting/policies.yml
# Notification routing. Managed in git: sync.sh overwrites it.
#
# Default: everything to email-oncall (email and SMS).
# Exception: ExternalSiteDegraded goes to email-only.
#
# group_by puts one system's alerts in their own notification: a different
# customer, VM or probe target never shares an email or SMS, so the subject
# always names what tripped.

apiVersion: 1

policies:
  - orgId: 1
    receiver: email-oncall
    group_by: ['alertname', 'customer', 'vm', 'instance']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: email-only
        object_matchers:
          - ['alertname', '=', 'ExternalSiteDegraded']
