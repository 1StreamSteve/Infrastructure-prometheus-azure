# /etc/grafana/provisioning/alerting/rules.yml
# Grafana-managed alert rules on the local Prometheus. Managed in git
# (Infrastructure-prometheus-azure): sync.sh overwrites it, and rules
# provisioned from file cannot be edited in the UI.
#
# Every rule is: A = Prometheus instant query, B = Reduce (last),
# C = Threshold on B. That makes each rule multi-dimensional: one alert per
# server or probe, carrying that series' labels (customer, vm, instance, site).
# The June build used classic conditions, which collapse every series into a
# single alert with no labels, so notifications could not say what tripped.
#
# Annotations: summary and description for the email body; value is the
# short reading shown at the end of the email and SMS subject
# (templates.yml, "1stream.subject").
#
# noDataState OK everywhere: a query with nothing to report (no slow probes,
# no long transactions, a removed customer) is healthy, not an alert.
# execErrState Error stays, so a broken Prometheus still raises an alert.
#
#   Rule                    Fires when                                        Sev       For
#   NginxDown               nginx_up = 0 on an nginx VM                       critical  1m
#   ExporterDown            nginx exporter unreachable                        warning   2m
#   HighActiveConnections   nginx active connections > 400                    warning   5m
#   HighCPU                 CPU > 85% (5m average)                            warning   5m
#   LowMemory               available memory < 10%                            warning   5m
#   LowDisk                 root filesystem < 20% free                        warning   5m
#   HighSystemLoad          1-min load > 4.0                                  warning   5m
#   PostgresDown            postgres_exporter unreachable                     critical  1m
#   LongRunningTransaction  a transaction open > 300s                         warning   5m
#   PgDeadlocks             deadlocks happening                               warning   5m
#   OdooVmDown              Odoo VM node_exporter unreachable                 critical  1m
#   SiteDown                customer Odoo probe failing                       critical  2m
#   SlowResponse            customer Odoo probe > 5s (successful probes)      warning   5m
#   SSLCertExpiringSoon     certificate expires within 14 days                warning   0
#   ExternalSiteDown        every external probe failed for 5 minutes        critical  1m
#   ExternalSiteDegraded    over half the external probes failed in 15 min   warning   0   (email only)
#   ExternalSlowResponse    median successful external probe > 5s over 10m   warning   5m

apiVersion: 1

deleteRules: []

groups:

  # ── nginx ──────────────────────────────────────────────────────────────────
  - orgId: 1
    name: nginx-health
    folder: 1Stream Alerts
    interval: 1m
    rules:
      - uid: nginx-down
        title: NginxDown
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "nginx is down on {{ $labels.vm }}"
          description: "nginx_up has been 0 for over a minute on {{ $labels.vm }} ({{ $labels.instance }}). Check nginx on the VM."
          value: "nginx_up {{ $values.B.Value }}"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, instant: true, expr: 'nginx_up'}
          - &reduceB
            refId: B
            datasourceUid: __expr__
            model: {refId: B, type: reduce, expression: A, reducer: last}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}

      - uid: exporter-down
        title: ExporterDown
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "nginx exporter unreachable on {{ $labels.vm }}"
          description: "Prometheus cannot scrape {{ $labels.instance }} ({{ $labels.vm }}) for over 2 minutes. The exporter may have stopped."
          value: "up {{ $values.B.Value }}"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, instant: true, expr: 'up{job=~"nginx-.*"}'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}

  - orgId: 1
    name: nginx-traffic
    folder: 1Stream Alerts
    interval: 1m
    rules:
      - uid: high-active-conns
        title: HighActiveConnections
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "High active connections on {{ $labels.vm }}"
          description: "Active nginx connections have been over 400 for 5 minutes on {{ $labels.vm }}. A traffic surge or a slow backend."
          value: "{{ printf \"%.0f\" $values.B.Value }} connections"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, instant: true, expr: 'nginx_connections_active'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [400]}}]}

  # ── OS, every VM with node_exporter ────────────────────────────────────────
  - orgId: 1
    name: os-health
    folder: 1Stream Alerts
    interval: 1m
    rules:
      - uid: high-cpu
        title: HighCPU
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "High CPU on {{ $labels.vm }}"
          description: "CPU has been over 85% for 5 minutes on {{ $labels.vm }} ({{ $labels.customer }})."
          value: "{{ printf \"%.0f\" $values.B.Value }}%"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 600, to: 0}
            model: {refId: A, instant: true, expr: '100 - (avg by (customer, vm, instance, role) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [85]}}]}

      - uid: low-memory
        title: LowMemory
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Low memory on {{ $labels.vm }}"
          description: "Available memory has been under 10% for 5 minutes on {{ $labels.vm }} ({{ $labels.customer }})."
          value: "{{ printf \"%.0f\" $values.B.Value }}% free"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, instant: true, expr: '(node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [10]}}]}

      - uid: low-disk
        title: LowDisk
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Low disk on {{ $labels.vm }}"
          description: "The root filesystem has been under 20% free for 5 minutes on {{ $labels.vm }} ({{ $labels.customer }})."
          value: "{{ printf \"%.0f\" $values.B.Value }}% free"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, instant: true, expr: '(node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) * 100'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [20]}}]}

      - uid: high-load
        title: HighSystemLoad
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "High system load on {{ $labels.vm }}"
          description: "The 1-minute load average has been over 4.0 (2x the CPUs of a 2-vCPU VM) for 5 minutes on {{ $labels.vm }} ({{ $labels.customer }})."
          value: "load {{ printf \"%.2f\" $values.B.Value }}"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, instant: true, expr: 'node_load1'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [4]}}]}

  # ── Postgres ───────────────────────────────────────────────────────────────
  - orgId: 1
    name: postgres-health
    folder: 1Stream Alerts
    interval: 1m
    rules:
      - uid: postgres-down
        title: PostgresDown
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "PostgreSQL unreachable on {{ $labels.vm }}"
          description: "Prometheus cannot scrape postgres_exporter on {{ $labels.vm }} ({{ $labels.instance }}) for over a minute. PostgreSQL or the exporter may be down."
          value: "up {{ $values.B.Value }}"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, instant: true, expr: 'up{job=~"postgres-.*"}'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}

      # HighPgConnections was removed in June: 2000 max_connections with 15
      # workers per tenant makes a percentage threshold meaningless.

      - uid: long-running-tx
        title: LongRunningTransaction
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Long-running transaction on {{ $labels.vm }}"
          description: "A transaction has been open for over 5 minutes on {{ $labels.vm }} ({{ $labels.customer }}). It can hold locks and cause bloat."
          value: "{{ printf \"%.0f\" $values.B.Value }}s open"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 600, to: 0}
            model: {refId: A, instant: true, expr: 'max by (customer, vm, instance) (pg_stat_activity_max_tx_duration{state!="idle"})'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [300]}}]}

      - uid: pg-deadlocks
        title: PgDeadlocks
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Deadlocks on {{ $labels.vm }} ({{ $labels.datname }})"
          description: "PostgreSQL has been reporting deadlocks for 5 minutes on {{ $labels.vm }}, database {{ $labels.datname }} ({{ $labels.customer }}). Look at the application's locking."
          value: "{{ printf \"%.3f\" $values.B.Value }}/s"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 600, to: 0}
            model: {refId: A, instant: true, expr: 'sum by (customer, vm, instance, datname) (rate(pg_stat_database_deadlocks[5m]))'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [0]}}]}

  # ── Odoo VMs ───────────────────────────────────────────────────────────────
  - orgId: 1
    name: odoo-health
    folder: 1Stream Alerts
    interval: 1m
    rules:
      - uid: odoo-vm-down
        title: OdooVmDown
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "Odoo VM unreachable: {{ $labels.vm }}"
          description: "Prometheus cannot scrape node_exporter on {{ $labels.vm }} ({{ $labels.instance }}) for over a minute. The VM may be down."
          value: "up {{ $values.B.Value }}"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, instant: true, expr: 'up{job=~"node-.*-odoo"}'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}

  # ── Customer Odoo probes (inside Azure, so kept tight) ─────────────────────
  - orgId: 1
    name: blackbox-health
    folder: 1Stream Alerts
    interval: 1m
    rules:
      - uid: site-down
        title: SiteDown
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "Odoo not answering for {{ $labels.customer }}"
          description: "The HTTP probe to {{ $labels.instance }} ({{ $labels.customer }}) has been failing for over 2 minutes."
          value: "probe failing"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, instant: true, expr: 'probe_success{job=~"blackbox-.*", job!~"blackbox-ext-.*"}'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}

      - uid: slow-response
        title: SlowResponse
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Odoo slow for {{ $labels.customer }}"
          description: "Successful probes to {{ $labels.instance }} ({{ $labels.customer }}) have taken over 5 seconds for 5 minutes."
          value: "{{ printf \"%.1f\" $values.B.Value }}s"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 300, to: 0}
            # Successful probes only: a failed probe's duration is its timeout,
            # and a site that is down is SiteDown's job, not this one's.
            model: {refId: A, instant: true, expr: 'probe_duration_seconds{job=~"blackbox-.*", job!~"blackbox-ext-.*"} and probe_success == 1'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [5]}}]}

      - uid: ssl-cert-expiring
        title: SSLCertExpiringSoon
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Certificate expiring for {{ $labels.instance }}"
          description: "The TLS certificate served by {{ $labels.instance }} expires in under 14 days."
          value: "{{ printf \"%.0f\" $values.B.Value }} days left"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, instant: true, expr: '(probe_ssl_earliest_cert_expiry{job=~"blackbox-.*"} - time()) / 86400'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [14]}}]}

  # ── External sites, probed from Azure across the internet ──────────────────
  # The path from Azure to Bree Street has short blips, and a slow TLS
  # handshake or two is not an outage. These rules look at a window of probes,
  # not the last one (probes every 30s, so 5 minutes is 10 probes).
  - orgId: 1
    name: external-probes
    folder: 1Stream Alerts
    interval: 1m
    rules:
      - uid: external-site-down
        title: ExternalSiteDown
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.site }} is down"
          description: "Every probe to {{ $labels.instance }} from Azure has failed for over 5 minutes."
          value: "all probes failing 5m"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 600, to: 0}
            model: {refId: A, instant: true, expr: 'max_over_time(probe_success{job=~"blackbox-ext-.*"}[5m])'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [1]}}]}

      - uid: external-site-degraded
        title: ExternalSiteDegraded
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }} is failing intermittently"
          description: "Over half the probes to {{ $labels.instance }} from Azure failed in the last 15 minutes, but not all of them for 5 minutes straight. Usually the site itself (slow TLS, overload) or the link. Email only."
          value: "{{ humanizePercentage $values.B.Value }} of probes OK"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 1200, to: 0}
            model: {refId: A, instant: true, expr: 'avg_over_time(probe_success{job=~"blackbox-ext-.*"}[15m])'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: lt, params: [0.5]}}]}

      - uid: external-slow-response
        title: ExternalSlowResponse
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.site }} is slow"
          description: "The median successful probe to {{ $labels.instance }} from Azure has taken over 5 seconds across 10 minutes, for 5 minutes."
          value: "median {{ printf \"%.1f\" $values.B.Value }}s"
        data:
          - refId: A
            datasourceUid: prometheus-ds
            relativeTimeRange: {from: 900, to: 0}
            model: {refId: A, instant: true, expr: 'quantile_over_time(0.5, (probe_duration_seconds{job=~"blackbox-ext-.*"} and probe_success == 1)[10m:30s])'}
          - *reduceB
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: B, conditions: [{evaluator: {type: gt, params: [5]}}]}
