# /etc/grafana/provisioning/datasources/prometheus.yml
# Provisions the local Prometheus instance as Grafana's default data source.

apiVersion: 1

datasources:
  - name:      Prometheus
    uid:       prometheus-ds
    type:      prometheus
    url:       http://localhost:9090
    isDefault: true
    access:    proxy
    editable:  false
    jsonData:
      timeInterval:        "15s"
      queryTimeout:        "60s"
      httpMethod:          POST
      prometheusType:      Prometheus
      prometheusVersion:   "2.45.0"
