# sync-manifest.conf: every git-managed file and where it lives on Monitoring-VM-001
#
# Columns: repo path, server path, owner:group, mode, what applies the change
#   prometheus  POST /-/reload on 127.0.0.1:9090
#   blackbox    POST /-/reload on 127.0.0.1:9115
#   grafana     Grafana re-reads its provisioning
#   nginx       nginx -t then reload
#   fail2ban    fail2ban-client reload
#   systemd     daemon-reload, then restart of that unit
#
# Owners and modes are as captured from the live VM on 18 Nov 2026, so a sync
# of unchanged files changes nothing.
#
# Not listed, and never written by sync:
#   /etc/prometheus/targets/customers/   customer files, owned by the team on the VM
#   /etc/grafana/grafana.ini              SMTP and admin passwords
#   /etc/nginx/nginx.conf                 Ubuntu's stock file

prometheus/prometheus.yml                       /etc/prometheus/prometheus.yml                               prometheus:prometheus                0644  prometheus
prometheus/targets/infrastructure.yml           /etc/prometheus/targets/infrastructure.yml                   prometheus:prometheus                0644  prometheus
prometheus/targets/external.yml                 /etc/prometheus/targets/external.yml                         prometheus:prometheus                0644  prometheus
prometheus/targets/customer.yml.example         /etc/prometheus/targets/customer.yml.example                 prometheus:prometheus                0644  prometheus
blackbox/blackbox.yml                           /etc/blackbox_exporter/blackbox.yml                          blackbox_exporter:blackbox_exporter  0644  blackbox
grafana/provisioning/alerting/rules.yml         /etc/grafana/provisioning/alerting/rules.yml                 grafana:grafana                      0644  grafana
grafana/provisioning/alerting/contactpoints.yml /etc/grafana/provisioning/alerting/contactpoints.yml         grafana:grafana                      0644  grafana
grafana/provisioning/alerting/templates.yml     /etc/grafana/provisioning/alerting/templates.yml             grafana:grafana                      0644  grafana
grafana/provisioning/alerting/policies.yml      /etc/grafana/provisioning/alerting/policies.yml              grafana:grafana                      0640  grafana
grafana/provisioning/datasources/prometheus.yml /etc/grafana/provisioning/datasources/prometheus.yml         root:grafana                         0640  grafana
nginx/prometheus.1stream.co.za.conf             /etc/nginx/sites-available/prometheus.1stream.co.za.conf     root:root                            0644  nginx
systemd/prometheus.service                      /etc/systemd/system/prometheus.service                       root:root                            0644  systemd
systemd/blackbox_exporter.service               /etc/systemd/system/blackbox_exporter.service                root:root                            0644  systemd
fail2ban/jail.local                             /etc/fail2ban/jail.local                                     root:root                            0644  fail2ban
